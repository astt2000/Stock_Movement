name: Market Data Stream Refresh

on:
  schedule:
    - cron: '0 * * * *' # Triggers automatically every hour
  workflow_dispatch: # Allows you to manually click "Run workflow"

# Bypasses the Node.js deprecation warnings by forcing Node 24 structures
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    
    # CRITICAL: Gives the automation bot explicit permissions to save the json file
    permissions:
      contents: write

    steps:
    - name: Checkout Repository Core
      uses: actions/checkout@v4

    - name: Initialize Enterprise Python Engine
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
      
    - name: Install Scientific Analytics Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas
        
        

    - name: Execute Live Technical Calculations
      run: python update_stocks.py

    - name: Commit and Push Synchronized Data Packet
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add live_market.json
        
        # Only commit if the file actually changed to avoid unnecessary actions loops
        git diff-index --quiet HEAD || (git commit -m "🔄 Core Technical Indicators Database Automated Refresh" && git push)
